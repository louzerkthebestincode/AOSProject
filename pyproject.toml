[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-simulator"
version = "0.1.0"
description = "Simulateur modulaire de détection et de récupération d'interblocages"
requires-python = ">=3.11"

[project.scripts]
deadlock-sim = "deadlock_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
